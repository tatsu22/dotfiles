# NOTEBOOK SETTINGS
[notebook]
dir = "~/notebook"

[note]

language = "en"

default-title = "Untitled"
filename = "{{id}}-{{slug-title}}"
extension = "md"

template = "default.md"

id-charset = "alphanum"
id-length = 4
id-case = "lower"

[extra]
author = "Tyler"

[group.daily]
paths = ["journal/daily"]

[group.daily.note]
filename = "{{format-date now}}"
extension = "md"
template = "daily.md"

[format.markdown]
hashtags = true
colon-tags = true
link-format = "wiki"


[tool]
editor = "nvim"
shell = "/bin/zsh"
pager = "less -FIRX"
fzf-preview = "bat -p --color always {-1}"

[filter]
recents = "--sort created- --created-after 'last two weeks'"

[alias]
daily = 'zk new --no-input "$ZK_NOTEBOOK_DIR/journal/daily"'
edlast = "zk edit --sort created- --created-after 'last two weeks' --interactive"
lucky = "zk list --quiet --format full --sort random --limit 1"

[lsp]

[lsp.diagnostics]
wiki-title = "hint"
dead-link = "error"
